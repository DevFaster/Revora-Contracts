[package]
name = "revora-contracts"
version = "0.1.0"
edition = "2021"

[features]
# Issue #465: Kani bounded verification harness (not enabled in default CI).
kani = []

# Issue #1356: Testnet-only tooling entrypoints (faucet, indexer fixture, simulation).
# Off by default — production/release builds exclude these to reduce wasm size and
# narrow the mainnet attack surface. Enable with `--features testnet`.
testnet = []

# `kani` is a cfg set by the Kani verifier (not a Cargo feature), so declare it as a
# known cfg to keep `unexpected_cfgs` quiet under `clippy --all-features -D warnings`.
[package.metadata.kani]
unwind = 4

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }

[dev-dependencies]
derive_arbitrary = "=1.3.2"
ed25519-dalek = "2.2.0"
proptest = "1.6.0"
serde_json = "1.0"
soroban-sdk = { version = "21.0.0", features = ["testutils", "alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true

[workspace]
members = ["indexer"]

